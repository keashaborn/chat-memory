      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    labels:
