x-governed-memory-scope: persistent-installation-candidate-inactive
x-governed-memory-qdrant-authorization: blocked-persistent-qdrant-digest-not-authorized
name: governed-memory-9a54cf123493-000001

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: governed-memory-postgres-9a54cf123493-000001
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: governed_memory_bootstrap
      POSTGRES_PASSWORD: "${GOVERNED_MEMORY_BOOTSTRAP_PASSWORD:?required}"
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
