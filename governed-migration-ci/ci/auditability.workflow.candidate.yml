name: Auditability Guard (seebx)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  audit-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed-memory schema ledger
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=schema-ledger/tools python3 -B -W error::ResourceWarning -m unittest discover -s schema-ledger/tests -p test_*.py
          python3 -B schema-ledger/tools/verify_manifest.py --root schema-ledger
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=schema-ledger/tools python3 -B schema-ledger/tools/validate_schema_ledger.py --root schema-ledger --repository . --repository-commit HEAD

      - name: Validate governed migration full chain
        env:
          GOVERNED_MIGRATION_DOCKER: /usr/bin/docker
          GOVERNED_MIGRATION_IMAGE: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
          GOVERNED_MIGRATION_RUN_ID: gmci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=governed-migration-ci/tools python3 -B -W error::ResourceWarning -m unittest discover -s governed-migration-ci/tests -p test_*.py
          python3 -B governed-migration-ci/tools/verify_manifest.py --root governed-migration-ci
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=governed-migration-ci/tools python3 -B governed-migration-ci/tools/validate_repository_migrations.py --root governed-migration-ci --schema-ledger-root schema-ledger --repository . --repository-commit HEAD
          "$GOVERNED_MIGRATION_DOCKER" pull "$GOVERNED_MIGRATION_IMAGE"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=governed-migration-ci/tools python3 -B governed-migration-ci/tools/full_chain_harness.py --root governed-migration-ci --schema-ledger-root schema-ledger --package governed-migration-ci/fixtures/gm_ci_add_governed_record_v1 --docker "$GOVERNED_MIGRATION_DOCKER" --image "$GOVERNED_MIGRATION_IMAGE" --run-id "$GOVERNED_MIGRATION_RUN_ID"

      - name: Build and start CI stack
        run: |
          docker compose -f docker-compose.ci.yml build
          docker compose -f docker-compose.ci.yml up -d
          docker compose -f docker-compose.ci.yml ps

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf -H 'x-vs-service-token: ci_only_service_token' http://127.0.0.1:8088/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "brains did not become healthy"
          docker compose -f docker-compose.ci.yml logs brains
          exit 1

      - name: Run audit canary
        run: |
          docker compose -f docker-compose.ci.yml exec -T brains \
            bash -lc 'VS_SERVICE_TOKEN=ci_only_service_token HOST=127.0.0.1 PORT=8088 PGHOST=postgres PGUSER=sage PGPASSWORD=ci_only_postgres_password PGDATABASE=memory ./tools/audit_canary.sh'

      - name: Run focused Memory V1 Python tests
        run: |
          docker compose -f docker-compose.ci.yml exec -T \
            -e PYTHONPATH=/app:/app/scripts \
            brains python -m pytest -p no:cacheprovider -q \
              tests/test_memory_v1_v5_local_claim_projection_v2.py \
              tests/test_admin_memory_health_v1.py \
              tests/test_memory_v1_contextual_chat_capture_bridge_v1.py \
              tests/test_memory_v1_v5_2_local_packet_router.py

      - name: Validate memory V1 schema firewall
        run: ./tools/memory_v1_schema_ci.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs brains
          docker compose -f docker-compose.ci.yml logs postgres

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
