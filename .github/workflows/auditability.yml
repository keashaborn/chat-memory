name: SeeBx Zep Runtime Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the current test runtime
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Reject retired home-built memory runtime paths
        shell: bash
        run: |
          set -euo pipefail
          retired_paths=(
            Dockerfile.ci
            docker-compose.ci.yml
            rag_engine/memory_v1_store.py
            rag_engine/successor_memory_chat_adapter_v1.py
            rag_engine/zep_memory_provider_v1.py
            ops/systemd/memory-v1-active-runtime-manifest-v1.json
            tests/test_successor_memory_chat_adapter_v1.py
            tests/test_successor_response_integration_v1.py
          )
          for path in "${retired_paths[@]}"; do
            test ! -e "$path"
          done
          if git grep -nE \
            'rag_engine\.governed_memory|rag_engine\.governed_memory_provider_v1|rag_engine\.memory_v1|successor_memory_chat_adapter_v1|governed_memory_successor_v1' \
            -- app.py 'seebx/**/*.py' rag_engine/lifeswitch_prompt_integration_v2.py; then
            exit 1
          fi

      - name: Validate current Zep and conversation contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest \
            tests.test_zep_cloud \
            tests.test_zep_full_erasure_v1 \
            tests.test_zep_prompt_memory_v1 \
            tests.test_zep_runtime_retirement_v1 \
            tests.test_zep_sync \
            tests.test_zep_sync_postgres \
            tests.test_prompt_assembler_v1 \
            tests.test_rm_runtime_v0_4 \
            tests.test_openai_chat_provider_v1 \
            tests.test_openai_chat_request_v4 \
            tests.test_lifeswitch_prompt_integration_v2 \
            tests.test_response_inspection_v1 \
            tests.test_response_inspection_v2 \
            tests.test_response_inspection_v4 \
            tests.test_response_orchestration_v0_2 \
            tests.test_response_finalization_v1 \
            tests.test_conversation_composition \
            tests.test_lifeswitch_conversation_composition

      - name: Compile current runtime entry points
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m compileall -q \
            app.py \
            seebx \
            rag_engine/lifeswitch_prompt_integration_v2.py
