name: Governed Memory Successor Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOVERNED_MEMORY_EXCLUSIVE_MODE: successor_pilot

jobs:
  successor-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the current test runtime
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Reject retired response paths
        shell: bash
        run: |
          set -euo pipefail
          retired_paths=(
            rag_engine/response_composition_root_v0_3.py
            rag_engine/response_finalization_v2.py
            rag_engine/response_inspection_v3.py
            rag_engine/response_persistence_v2.py
            rag_engine/governed_memory/response_defaults.py
            tests/test_lifeswitch_response_runtime_v1.py
            tests/test_response_inspection_v3.py
            tests/memory/test_response_defaults.py
          )
          for path in "${retired_paths[@]}"; do
            test ! -e "$path"
          done
          if git grep -nE \
            'response_(composition_root_v0_3|finalization_v2|inspection_v3|persistence_v2)' \
            -- 'app.py' 'rag_engine/*.py' 'tests/*.py' 'tests/**/*.py'; then
            exit 1
          fi
          if git grep -nE \
            'governed_memory_v1|MemoryPrompt(AssemblyInput|ApplicationResult)V1|assistant_response_preferences' \
            -- \
              rag_engine/prompt_assembler_v1.py \
              rag_engine/response_composition_root_v0_2.py \
              rag_engine/response_orchestration_v0_2.py \
              rag_engine/openai_chat_provider_v1.py \
              rag_engine/lifeswitch_prompt_integration_v2.py \
              rag_engine/lifeswitch_answer_binding_v1.py \
              rag_engine/openai_chat_request_v4.py \
              rag_engine/usage_ledger_v1.py \
              rag_engine/response_finalization_v1.py \
              rag_engine/response_finalization_v3.py \
              rag_engine/response_inspection_v1.py \
              rag_engine/response_inspection_v2.py \
              rag_engine/response_inspection_v4.py \
              rag_engine/resse_response_router.py; then
            exit 1
          fi

      - name: Validate the current successor contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest discover -s tests/memory -p 'test_*.py'
          python -B -m unittest \
            tests.test_lifeswitch_answer_binding_v1 \
            tests.test_lifeswitch_answer_provenance_receipt_v1 \
            tests.test_lifeswitch_coaching_self_shadow_adapter_v2 \
            tests.test_lifeswitch_coaching_self_shadow_runner_v2 \
            tests.test_lifeswitch_prompt_integration_v2 \
            tests.test_openai_chat_provider_v1 \
            tests.test_openai_chat_request_v4 \
            tests.test_prompt_assembler_v1 \
            tests.test_response_composition_root_v0_2 \
            tests.test_response_conversation_snapshot_v1 \
            tests.test_response_finalization_v1 \
            tests.test_response_inspection_v1 \
            tests.test_response_orchestration_v0_2 \
            tests.test_response_persistence_v1 \
            tests.test_response_persistence_v3 \
            tests.test_resse_response_router \
            tests.test_successor_memory_chat_adapter_v1 \
            tests.test_successor_response_integration_v1 \
            tests.test_usage_ledger_v1
          python -B tools/governed_memory_install/package.py verify-package
          python -B tools/governed_memory_validation/verify_store_migration_manifest.py
          python -B tools/governed_memory_validation/verify_migration_manifest.py \
            governed-memory-migrations
          python -B tools/governed_memory_release/release_guard.py verify-artifacts

      - name: Compile current runtime entry points
        run: |
          python -B -m py_compile \
            app.py \
            rag_engine/chat_integrity.py \
            rag_engine/governed_memory_erasure_proxy_v1.py \
            rag_engine/lifeswitch_answer_binding_v1.py \
            rag_engine/response_composition_root_v0_2.py \
            rag_engine/response_composition_root_v0_4.py \
            rag_engine/response_finalization_v1.py \
            rag_engine/response_finalization_v3.py \
            rag_engine/response_inspection_v1.py \
            rag_engine/response_inspection_v4.py \
            rag_engine/response_persistence_v1.py \
            rag_engine/response_persistence_v3.py \
            rag_engine/resse_response_router.py \
            rag_engine/usage_ledger_v1.py
