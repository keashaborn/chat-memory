registry_id: lifeswitch.projection_registry
registry_version: 1
manager_contract: lifeswitch.coaching_context@0.2.0-candidate
projection_schema_version: 1

global_limits:
  default_projection_count: 6
  max_projection_count: 6
  default_context_bytes: 32768
  max_context_bytes: 32768
  overflow_behavior: typed_truncation
  unexecuted_overflow_behavior: selection_result_only

projection_error_codes:
  - incompatible_projection_version
  - malformed_projection_payload

payload_failure_policy:
  fail_closed: true
  fallback_allowed: false
  forbidden_fallbacks:
    - legacy_data
    - raw_database_rows
    - raw_json
    - partially_parsed_payload

truncation_reasons:
  - projection_count_limit
  - projection_row_limit
  - projection_byte_limit
  - context_byte_limit

lifecycle_states:
  - present
  - explicit_zero
  - missing
  - absent
  - in_progress
  - incomplete
  - corrected
  - deleted

decision_blocks:
  - D01_HISTORICAL_PLAN_AUTHORITY
  - D02_RELATIVE_DATE_SEMANTICS
  - D03_MEASUREMENT_COLLISIONS
  - D04_RECOVERY_ADJUSTMENT_PRECEDENCE
  - D05_HEALTH_ESCALATION_THRESHOLDS
  - D06_FORECAST_METHOD

hard_failures:
  HF14: client-controlled identity or binding affects authority
  HF15: denial reveals existence, relationship, permission, or record information
  HF16: sensitive or delegated data crosses trace, cache, queue, Memory, FM, Qdrant, or web lanes
  HF17: output is used after authorization-epoch or context-snapshot invalidation
  HF18: budget, schema, malformed-payload, or field-policy violation fails open

authorization:
  permission_order:
    - none
    - view
    - comment
    - edit
    - admin
  exact_read_scopes:
    plan: plan:view
    nutrition: nutrition:view
    training: training:view
    conditioning: training:view
    measurements: measurements:view
    messages: messages:view
  rules:
    - higher levels satisfy view only on the same exact scope
    - plan:comment and plan:edit do not replace plan:view
    - messages:send does not replace messages:view
    - measurement write scopes do not authorize reads
    - workout-template scopes do not authorize coaching-context reads
    - no broad people:view scope exists
    - initial delegated access is capped at S1
    - check-ins are self-only initially
  sensitivity_tiers:
    S0: content-free authorization and operational metadata
    S1: routine plan, nutrition, training, conditioning, and core numeric measurement data
    S2: private free text, ordinary coaching notes, and check-ins
    S3: pain, injury, medication, digestion, reproductive, or eating-risk content
    S4: private communications

budget_semantics:
  window_boundary: inclusive_local_dates
  relative_dates: decision_blocked
  row_limit: typed_projection_truncation
  byte_limit: typed_projection_or_context_truncation
  budgets_are_candidate_bounds: true

projections:
  - projection_id: plan.current.v1
    domain: plan
    readiness: READY
    initial_self_s1: true
    authorization_scopes: ["plan:view"]
    sensitivity_ceiling: S1
    source_contract:
      owner: source_gateway
      current_source: lifeswitch_agentic.plan_owner_state_to_plan_versions
      gateway_requirement: restricted subject-bound current-plan gateway with typed target field mask
    calculation:
      owner: none
      inputs:
        - plan.current.v1
    window:
      kind: as_of_snapshot
      default_days: 1
      max_days: 1
      decision_blocks: []
    budget:
      default_rows: 1
      max_rows: 1
      default_bytes: 3072
      max_bytes: 4096

  - projection_id: plan.targets.current.v1
    domain: plan
    readiness: READY
    initial_self_s1: false
    authorization_scopes: ["plan:view"]
    sensitivity_ceiling: S1
    source_contract:
      owner: source_gateway
      current_source: lifeswitch_agentic.plan_versions.current_typed_targets
      gateway_requirement: restricted subject-bound current-target gateway and field whitelist
    calculation:
      owner: none
      inputs:
        - plan.targets.current.v1
    window:
      kind: as_of_snapshot
      default_days: 1
      max_days: 1
      decision_blocks: []
    budget:
      default_rows: 1
      max_rows: 1
      default_bytes: 2048
      max_bytes: 4096

  - projection_id: plan.history.v1
    domain: plan
    readiness: NEEDS_GATEWAY
    initial_self_s1: false
    authorization_scopes: ["plan:view"]
    sensitivity_ceiling: S1
    source_contract:
      owner: source_gateway
      current_source: agentic_and_legacy_plan_stores
      gateway_requirement: historical-plan gateway after authority and effective-interval decision
    calculation:
      owner: none
      inputs:
        - plan.history.v1
    window:
      kind: explicit_local_date_range
      default_days: 365
      max_days: 1095
      decision_blocks:
        - D01_HISTORICAL_PLAN_AUTHORITY
        - D02_RELATIVE_DATE_SEMANTICS
    budget:
      default_rows: 24
      max_rows: 100
      default_bytes: 8192
      max_bytes: 16384

  - projection_id: plan.recovery_adjustments.v1
