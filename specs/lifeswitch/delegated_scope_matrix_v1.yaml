canonical_hard_failures:
  HF14: client_controlled_identity_or_binding_affects_authority
  HF15: denial_reveals_existence_relationship_permission_or_record_information
  HF16: sensitive_or_delegated_data_crosses_context_lane
  HF17: output_released_after_epoch_or_snapshot_invalidation
  HF18: budget_schema_malformed_payload_or_field_policy_violation_fails_open

canonical_selection_and_error_codes:
  truncation_reasons:
    - projection_count_limit
    - projection_row_limit
    - projection_byte_limit
    - context_byte_limit
  projection_errors:
    - incompatible_projection_version
    - malformed_projection_payload
