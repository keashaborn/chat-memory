schema_id: lifeswitch.delegated_scope_matrix
schema_version: 1
status: candidate
initial_v2_mode: read_only
initial_subject_limit: 1
delegated_sensitivity_ceiling: S1
projection_count_limit: 6
context_byte_limit: 32768

directional_predicate:
  - server_verified_actor_equals_bound_actor
  - exactly_one_explicit_subject
  - relationship_joins_exact_actor_and_subject
  - relationship_status_is_accepted
  - grantor_user_id_equals_subject_user_id
  - grantee_user_id_equals_actor_user_id
  - exact_required_permission_scope
  - permission_is_enabled
  - permission_level_meets_minimum_and_is_not_none
  - grant_and_relationship_share_authorization_edge
  - requested_fields_do_not_exceed_sensitivity_ceiling
  - authorization_epoch_is_current

permission_levels:
  order: [none, view, comment, edit, admin]
  read_minimum: view
  rules:
    - A higher level satisfies only the same exact scope.
    - plan:comment and plan:edit never replace plan:view.
    - messages:send never replaces messages:view.
    - Unknown levels, unknown scopes, conflicting grants, and malformed permission rows deny.

scope_catalog:
  "plan:view":
    establishment: existing
    minimum_level: view
    authorizes_context_read: true
    domains: [plan]
  "nutrition:view":
    establishment: existing
    minimum_level: view
    authorizes_context_read: true
    domains: [nutrition]
  "training:view":
    establishment: existing
    minimum_level: view
    authorizes_context_read: true
    domains: [training, conditioning]
  "measurements:view":
    establishment: existing
    minimum_level: view
    authorizes_context_read: true
    domains: [measurements]
  "messages:view":
    establishment: future
    minimum_level: view
    authorizes_context_read: false
    domains: [messages]
    missing_requirements:
      - explicit_scope_creation_and_review
      - side_effect_free_direct_conversation_gateway
      - active_direct_conversation_membership_check
  "messages:send":
    establishment: existing
    minimum_level: comment
    authorizes_context_read: false
    domains: []
  "measurements:enter":
    establishment: existing
    minimum_level: edit
    authorizes_context_read: false
    domains: []
  "measurements:edit_recent":
    establishment: existing
    minimum_level: edit
    authorizes_context_read: false
    domains: []
  "plan:comment":
    establishment: existing
    minimum_level: comment
    authorizes_context_read: false
    domains: []
  "plan:edit":
    establishment: existing
    minimum_level: edit
    authorizes_context_read: false
    domains: []
  "workout_template:share":
    establishment: existing
    minimum_level: edit
    authorizes_context_read: false
    domains: []
  "workout_template:copy":
    establishment: existing
    minimum_level: edit
    authorizes_context_read: false
    domains: []

generic_denial:
  all_denied_text: "I can’t access the requested information."
  partial_text: "Some requested information is unavailable under the current access."
  externally_equivalent_causes:
    - unknown_subject
    - nonexistent_subject
    - missing_relationship
    - pending_relationship
    - blocked_relationship
    - revoked_relationship
    - wrong_grant_direction
    - missing_scope
    - disabled_grant
    - permission_level_none
    - malformed_authorization_edge
  forbidden_disclosures:
    - failed_scope_name
    - relationship_state
    - permission_state
    - denied_record_count
    - denied_record_existence
    - denied_source_provenance
    - timing_distinction

epoch_policy:
  recheck_points: [pre_retrieval, pre_prompt, delivery]
  increments_on:
    - relationship_status_change
    - grant_enable_or_disable
    - permission_level_change
    - permission_scope_change
    - relationship_revoke_or_block
    - relationship_reaccept
    - explicit_regrant
  invalidation_effects:
    - discard_delegated_context
    - discard_undelivered_answer
    - block_cache_reuse
    - cancel_queued_work
    - block_background_transcript_search
  reacceptance_rule: explicit_regrant_required

projection_scope_matrix:
  plan.current.v1:
    required_scopes: ["plan:view"]
    maximum_tier: S1
    delegated_contract: existing_scope
    gateway_state: v2_subject_bound_gateway_required
    benchmark_refs: [A02, A03, A04, A05, A06, A08, A09]
  plan.targets.current.v1:
    required_scopes: ["plan:view"]
    maximum_tier: S1
    delegated_contract: existing_scope
    gateway_state: v2_subject_bound_gateway_required
    benchmark_refs: [A02, A03, A04, A05, A06, A08, A09]
  plan.history.v1:
    required_scopes: ["plan:view"]
    maximum_tier: S1
    delegated_contract: decision_blocked
    gateway_state: new_restricted_gateway_required
    decision_blocks: [D01_HISTORICAL_PLAN_AUTHORITY]
    benchmark_refs: [A02, A03, A05, B08]
  plan.recovery_adjustments.v1:
