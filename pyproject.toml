[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seebx-backend"
version = "0.1.0"
description = "SeeBx backend with Zep conversation memory and LifeSwitch domain services"
requires-python = "==3.12.*"
dependencies = [
  "asyncpg==0.30.0",
  "cryptography==49.0.0",
  "fastapi==0.120.4",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "openai==2.6.1",
  "pydantic==2.12.3",
  "PyJWT==2.13.0",
  "requests==2.32.5",
  "uvicorn==0.38.0",
  "websockets==15.0.1",
  "zep-cloud==3.25.0",
]

[tool.setuptools.packages.find]
include = ["seebx", "seebx.*", "lifeswitch_agentic", "lifeswitch_agentic.*"]
namespaces = false
